networks:
  frontend-net:
    driver: bridge
  backend-net:
    driver: bridge
    internal: false

services:
  # 1. Database MySQL
  db:
    image: mysql:8.0
    container_name: student_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSecurePassword_2026! # Hardening: Mật khẩu mạnh
      MYSQL_DATABASE: student_db
      MYSQL_USER: student_user
      MYSQL_PASSWORD: SecurePass_123!               # Hardening: Mật khẩu mạnh
    networks:
      - backend-net
    # Hardening: Không expose port 3306 ra ngoài máy host (Network Isolation)

  # 2. Quản lý DB - phpMyAdmin
  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: student_phpmyadmin
    restart: always
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: RootSecurePassword_2026!
    ports:
      - "8081:80"
    networks:
      - backend-net

  # 3. Flask Web Application
  app:
    build: ./app
    container_name: student_app
    restart: always
    environment:
      - DB_HOST=db
      - MYSQL_USER=student_user
      - MYSQL_PASSWORD=SecurePass_123!
      - MYSQL_DATABASE=student_db
    networks:
      - frontend-net
      - backend-net

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: student_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - frontend-net

  # 5. Monitoring - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: student_prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - frontend-net

  # 6. Monitoring - cAdvisor (Giám sát Container metrics)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: student_cadvisor
    restart: always
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - frontend-net

  # 7. Dashboard - Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: student_grafana
    restart: always
    ports:
      - "3000:3000"
    networks:
      - frontend-net

  # 8. Logging - Loki
  loki:
    image: grafana/loki:2.9.0
    container_name: student_loki
    ports:
      - "3100:3100"
    networks:
      - frontend-net

  # 9. Log Collector - Promtail
  promtail:
    image: grafana/promtail:2.9.0
    container_name: student_promtail
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - frontend-net

